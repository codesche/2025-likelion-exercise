services:

# docker network  create prod_server     도커 네트워크 만들어야 함!
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - prod_server
    restart: unless-stopped


  database:
    image: mysql:8
    container_name: database
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: backendDB
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - ./volumes/mysql-data:/var/lib/mysql     #내가 지정한 경로
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      timeout: 20s
      retries: 10
    networks:
      - prod_server
    restart: unless-stopped


networks:
  prod_server:
    external: true